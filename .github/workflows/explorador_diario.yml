name: Explorador diario

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: explorador-diario
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Explorar Mexico y S&P 500
        run: python scan_market.py --market ambos --batch-size 25 --pause 1.5 --out data/market_scan.json

      - name: Guardar reporte para Streamlit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market_scan.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar explorador bursatil al cierre'
            git push
          else
            echo 'Sin cambios en reporte'
          fi

      - name: Enviar resumen por correo (opcional)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python daily_report.py
